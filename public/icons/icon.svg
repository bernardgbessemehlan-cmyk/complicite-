<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2b"/>
      <stop offset="50%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="heartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="heartGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#a18cd1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="rgba(255, 117, 140, 0.3)" stroke-width="2"/>

  <!-- Glowing Heart 1 (Left / Pink) -->
  <g filter="url(#glow)">
    <path d="M210 270 C210 170 80 120 80 250 C80 340 210 400 210 400 C210 400 340 340 340 250 C340 120 210 170 210 270 Z" 
          fill="url(#heartPink)" transform="translate(-15, -20) rotate(-12 210 270)"/>
  </g>

  <!-- Glowing Heart 2 (Right / Purple-Gold) -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M315 260 C315 160 185 110 185 240 C185 330 315 390 315 390 C315 390 445 330 445 240 C445 110 315 160 315 260 Z" 
          fill="url(#heartGold)" transform="translate(15, -15) rotate(14 315 260)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="120" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="400" cy="140" r="8" fill="#ffd166" opacity="0.85"/>
  <circle cx="380" cy="380" r="5" fill="#05d9e8" opacity="0.8"/>
  <circle cx="130" cy="360" r="7" fill="#ff758c" opacity="0.75"/>

  <!-- Brand Initial / Text Minimal -->
  <text x="256" y="460" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMPLICITÉ</text>
</svg>
